name: Check prices

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # the "Run workflow" button
  push:
    paths:
      - "items.json"        # check straight away when an item is added
      - "scripts/**"        # and when the price reader changes

permissions:
  contents: write
  issues: write

concurrency:
  group: wishlist-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read prices and photos
        run: python3 scripts/check_prices.py

      - name: Email me about deals
        # GitHub emails you when you are mentioned in an issue, so a deal
        # shows up in your inbox as a new issue that mentions you.
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: scripts/notify.sh "Wishlist deal"

      - name: Save the new prices
        run: |
          rm -f alerts.txt issue.md
          git config user.name "wishlist-bot"
          git config user.email "wishlist-bot@users.noreply.github.com"
          git add items.json
          git diff --staged --quiet || git commit -m "Update prices"
          git pull --rebase -q
          git push
