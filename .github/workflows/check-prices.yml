name: Check prices

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # the "Run workflow" button
  push:
    paths:
      - "items.json"        # check straight away when an item is added

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read prices and photos
        run: python3 scripts/check_prices.py

      - name: Email me about deals
        # GitHub emails you when you are mentioned in an issue, so a deal
        # shows up in your inbox as a new issue that mentions you.
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s alerts.txt ]; then
            {
              echo "@$OWNER, there is news on your wishlist:"
              echo
              sed 's/^/- /' alerts.txt
              echo
              echo "See the full list: https://$OWNER.github.io/${REPO#*/}/"
            } > issue.md
            gh issue create --repo "$REPO" \
              --title "Wishlist deal: $(head -n 1 alerts.txt | cut -c1-70)" \
              --body-file issue.md
          fi

      - name: Save the new prices
        run: |
          rm -f alerts.txt issue.md
          git config user.name "wishlist-bot"
          git config user.email "wishlist-bot@users.noreply.github.com"
          git add items.json
          git diff --staged --quiet || git commit -m "Update prices"
          git pull --rebase -q
          git push
